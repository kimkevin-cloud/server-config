services:
  nginx:
    container_name: nginx
    image: docker.io/nginx:alpine
    ports:
      - '80:80'
    volumes:
      - ./nginx-config:/etc/nginx/conf.d
    networks:
      - minio

  frontend:
    image: gitlab.dit.htwk-leipzig.de:5050/projekt2025-k-proaktive-services-mit-mein.kiel/frontend
    container_name: frontend
    networks:
      - minio

  # Hinweise:
  # - MinIO ist nach dem Start unter http://localhost:9001 (Konsole) erreichbar.
  # - Zugangsdaten: minioadmin / minioadmin
  # - Init-Skripte und Startdaten können in ./minio-init abgelegt werden.
  minio:
    image: minio/minio:latest
    container_name: minio
    # environment:
      # MINIO_ROOT_USER: minioadmin
      # MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    networks:
      - minio

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
        sleep 5;
        MINIO_ROOT_USER=$$(cat /run/secrets/minio_root_user);
        MINIO_ROOT_PASSWORD=$$(cat /run/secrets/minio_root_password);
        echo bruh

        mc alias set myminio http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
        mc mb myminio/userdata;
      "
    secrets:
      - minio_root_user
      - minio_root_password
    networks:
      - minio

  forms-service:
    container_name: forms-service
    image: gitlab.dit.htwk-leipzig.de:5050/projekt2025-k-proaktive-services-mit-mein.kiel/antragstellung
    environment:
      - NODE_ENV=production
    depends_on:
      - minio
    networks:
      - minio

  documentservice:
    container_name: documentservice
    image: gitlab.dit.htwk-leipzig.de:5050/projekt2025-k-proaktive-services-mit-mein.kiel/dokumentenverwaltung
    environment:
      - NODE_ENV=production
    depends_on:
      - minio
    networks:
      - minio
  
networks:
  minio:
volumes:
  minio_data:

secrets:
  minio_root_user:
    external: true
  minio_root_password:
    external: true