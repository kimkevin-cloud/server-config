services:
  nginx:
    container_name: nginx
    image: docker.io/nginx:alpine
    ports:
      - $NGINX_PORT:$NGINX_PORT
    environment:
      - EXTERNAL_PORT=$NGINX_PORT # nginx muss den externen Port kennen, um absolute Redirect-
        # Antworten an den Client mit dem richtigen Port erstellen zu können
    volumes:
      - ./nginx-config:/etc/nginx/templates
    entrypoint: >
      /bin/sh -c "
        envsubst '$${EXTERNAL_PORT}' < /etc/nginx/templates/default.conf.template > /etc/nginx/conf.d/default.conf;
        exec nginx -g 'daemon off;'
      "
    networks:
      - nginx
    depends_on:
      - frontend
      - document-service
      - forms-service

  frontend:
    image: gitlab.dit.htwk-leipzig.de:5050/projekt2025-k-proaktive-services-mit-mein.kiel/frontend-v2
    container_name: frontend
    networks:
      - nginx

  # - Zugangsdaten: siehe .env
  minio:
    image: minio/minio:latest
    container_name: minio
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    networks:
      - nginx

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
        sleep 5;
        MINIO_ROOT_USER=${MINIO_USER};
        MINIO_ROOT_PASSWORD=${MINIO_PASSWORD};

        mc alias set myminio http://minio:9000 ${MINIO_USER} ${MINIO_PASSWORD};
        mc mb myminio/userdata;
      "
    networks:
      - nginx

  forms-service:
    container_name: forms-service
    image: gitlab.dit.htwk-leipzig.de:5050/projekt2025-k-proaktive-services-mit-mein.kiel/antragstellung
    environment:
      - NODE_ENV=production
    depends_on:
      - minio
    networks:
      - nginx

  document-service:
    container_name: document-service
    image: gitlab.dit.htwk-leipzig.de:5050/projekt2025-k-proaktive-services-mit-mein.kiel/dokumentenverwaltung
    environment:
      - NODE_ENV=production
    depends_on:
      - minio
    networks:
      - nginx

  solid:
    platform: linux/amd64 # Fehler auf arm64 verhindern (CSS hat nur amd64 images)
    container_name: solid
    image: solidproject/community-server:latest
    volumes:
      # Persistente Daten für die Pods
      - ./solid-data:/data
    command: >
      -c config/file.json
      -f /data
      -l info
    networks:
      - nginx

networks:
  nginx:
volumes:
  minio_data:
