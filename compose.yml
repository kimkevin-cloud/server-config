services:
  nginx:
    container_name: nginx
    image: docker.io/nginx:alpine
    ports:
      - $NGINX_PORT:$NGINX_PORT
    environment:
      - EXTERNAL_PORT=$NGINX_PORT # nginx muss den externen Port kennen, um absolute Redirect-
        # Antworten an den Client mit dem richtigen Port erstellen zu können
    volumes:
      - ./nginx-config:/etc/nginx/templates
    entrypoint: >
      /bin/sh -c "
        envsubst '$${EXTERNAL_PORT}' < /etc/nginx/templates/default.conf.template > /etc/nginx/conf.d/default.conf;
        exec nginx -g 'daemon off;'
      "
    networks:
      - nginx
    depends_on:
      - frontend
      - document-service
      - forms-service

  frontend:
    image: gitlab.dit.htwk-leipzig.de:5050/projekt2025-k-proaktive-services-mit-mein.kiel/frontend-v2
    container_name: frontend
    environment:
      - PUBLIC_SOLID_URL=https://solid.valetudo.casa
      - PUBLIC_SERVER_DOCUMENTS_URL=http://document-service:3001
      - PUBLIC_DOCUMENTS_URL=https://sp25.imn.htwk-leipzig.de/documents
    networks:
      - nginx

  # - Zugangsdaten: siehe .env
  # Deprecated
  minio:
    image: minio/minio:latest
    container_name: minio
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    networks:
      - nginx

  # Deprecated
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
        sleep 5;
        MINIO_ROOT_USER=${MINIO_USER};
        MINIO_ROOT_PASSWORD=${MINIO_PASSWORD};

        mc alias set myminio http://minio:9000 ${MINIO_USER} ${MINIO_PASSWORD};
        mc mb myminio/userdata;
      "
    networks:
      - nginx

  # Deprecated
  forms-service:
    container_name: forms-service
    image: gitlab.dit.htwk-leipzig.de:5050/projekt2025-k-proaktive-services-mit-mein.kiel/antragstellung
    environment:
      - NODE_ENV=production
    depends_on:
      - minio
    networks:
      - nginx

  # Deprecated
  document-service:
    container_name: document-service
    image: gitlab.dit.htwk-leipzig.de:5050/projekt2025-k-proaktive-services-mit-mein.kiel/dokumentenverwaltung
    environment:
      - NODE_ENV=production
    depends_on:
      - minio
    networks:
      - nginx

  ### wird extern gehosted (https://solid.valetudo.casa) bis wird auf der HTWK proxy eine Subdomain
